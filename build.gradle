plugins {
    id "java"
    id "net.neoforged.moddev" version "2.0.76"
}

group = project.findProperty("group")
version = project.findProperty("version")

java {
    toolchain {
        // NeoForge 1.21.1 expects Java 21+
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup("maven.modrinth") }
    }
    maven { url = "https://maven.blamejared.com" }
    mavenCentral()
}

neoForge {
    // Core NeoForge + mappings configuration
    version = project.findProperty("neo_version")
    parchment {
        minecraftVersion = project.findProperty("parchment_minecraft")
        mappingsVersion = project.findProperty("parchment_version")
    }

    runs {
        // Keep the standard dev run configs; we will wire mod content as it is ported.
        client { client() }
        server { server() }
        data { data() }
    }

    mods {
        // Single-mod workspace; hook main source set.
        "${project.findProperty("mod_id")}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Mod runtime + compile dep; resolved via the NeoForge maven above.
    implementation "net.neoforged:neoforge:${project.findProperty("neo_version")}"

    // Curios API for companion equipment integration (optional at runtime)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.findProperty("curios_version")}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.findProperty("curios_version")}"

    // Optional HUD integrations (Jade / WTHIT). Kept compileOnly so the mod remains optional; runtimeOnly enables local dev runs.
    compileOnly "maven.modrinth:jade:${project.findProperty("jade_version")}" 
    compileOnly "maven.modrinth:wthit:${project.findProperty("wthit_version")}" 

    // JEI is optional at runtime; its plugin only supplies viewer entries for custom brewing.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${project.findProperty("jei_version")}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.findProperty("jei_version")}"

    // Epic Fight supplies the optional companion combat patch and renderer at runtime.
    compileOnly "maven.modrinth:epic-fight:${project.findProperty("epicfight_version")}"
    runtimeOnly "maven.modrinth:epic-fight:${project.findProperty("epicfight_version")}"
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.register("workerSafetyCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.entity.job.WorkerSafetyPredicatesTest"
    jvmArgs "-ea"
}

tasks.register("companionResourcesCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.entity.CompanionResourceRulesTest"
    jvmArgs "-ea"
}

tasks.register("firearmCategoryCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.compat.firearms.FirearmSupportTest"
    jvmArgs "-ea"
}

tasks.register("alertTargetCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.entity.ai.AlertTargetRulesTest"
    jvmArgs "-ea"
}

tasks.register("alertConfigMigrationCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.core.AlertConfigDefaultsTest"
    jvmArgs "-ea"
}

tasks.register("followLeashCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.entity.ai.FollowLeashRulesTest"
    jvmArgs "-ea"
}

tasks.register("structureSpawnCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.world.StructureCompanionSpawnerTest"
    jvmArgs "-ea"
}

tasks.register("epicFightCombatAiCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.compat.epicfight.CompanionEpicFightPatchTest"
    jvmArgs "-ea"
}

tasks.register("epicFightCapabilityCheck") {
    def weaponTypes = [dagger: "dagger", hammer: "axe", club: "axe", spear: "spear", quarterstaff: "longsword", glaive: "spear"]
    doLast {
        ["wooden", "stone", "iron", "golden", "diamond", "netherite", "bronze"].each { material ->
            weaponTypes.each { weapon, category ->
                def capability = file("src/main/resources/data/modern_companions/capabilities/weapons/${material}_${weapon}.json")
                if (!capability.isFile() || !capability.text.contains("\"type\": \"epicfight:${category}\"")) {
                    throw new GradleException("Missing Epic Fight capability for ${material}_${weapon}")
                }
            }
        }
    }
}

tasks.named("check") {
    // Keep all dynamically registered weapon families covered by the capability data.
    dependsOn("epicFightCapabilityCheck")
}

tasks.named("check") {
    dependsOn tasks.named("workerSafetyCheck")
    dependsOn tasks.named("companionResourcesCheck")
    dependsOn tasks.named("alertTargetCheck")
    dependsOn tasks.named("alertConfigMigrationCheck")
    dependsOn tasks.named("followLeashCheck")
    dependsOn tasks.named("firearmCategoryCheck")
    dependsOn tasks.named("structureSpawnCheck")
    dependsOn tasks.named("epicFightCombatAiCheck")
}

tasks.processResources.configure {
    // Re-run when any expanded property changes (e.g., version/mod_id).
    inputs.properties([
            version            : project.version,
            mod_id             : project.findProperty("mod_id"),
            mod_name           : project.findProperty("mod_name"),
            mod_author         : project.findProperty("mod_author"),
            minecraft_version  : project.findProperty("minecraft_version"),
            neo_version        : project.findProperty("neo_version")
    ])

    // Inject project properties into mod metadata.
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(project.properties)
    }
}

tasks.register("teleportPolicyCheck", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.majorbonghits.moderncompanions.entity.ai.CompanionTeleportRulesTest"
    jvmArgs "-ea"
}

tasks.named("check") {
    dependsOn tasks.named("teleportPolicyCheck")
}
